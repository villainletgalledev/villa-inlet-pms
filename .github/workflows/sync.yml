name: Sync to Vercel Repo

on:
  push:
    branches:
      - main 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check if Secret is Empty
        run: |
          if [ -z "${{ secrets.SYNC_PAT }}" ]; then
            echo "ERROR: The SYNC_PAT secret is empty or missing!"
            exit 1
          else
            echo "SUCCESS: The secret is loaded and ready."
          fi

      - name: Force Push to Destination
        run: |
          git remote add destination https://${{ secrets.SYNC_PAT }}@github.com/villainletgalledev/villa-inlet-pms.git
          git push destination main --force
